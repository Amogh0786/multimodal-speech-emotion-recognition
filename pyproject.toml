[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech_emotion_recognition"
version = "0.1.0"
description = "End-to-End Multimodal Speech Emotion Recognition System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "GANTA BALA AMOGH RAJ", email = "balaamoghraj@gmail.com"}
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
